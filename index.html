:scale(.5);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}.crumbs{position:absolute;inset:0;pointer-events:none}.crumb{position:absolute;top:58%;left:50%;width:16px;height:14px;background:#d5c8b5;border-radius:40% 55% 32% 48%;opacity:0}.crumbs.active .crumb{animation:scatter .75s steps(7,end) forwards;--x:0px;--y:0px;--r:0deg}.crumbs.active .crumb:nth-child(1){--x:-90px;--y:70px;--r:140deg}.crumbs.active .crumb:nth-child(2){--x:65px;--y:100px;--r:-90deg;animation-delay:.04s}.crumbs.active .crumb:nth-child(3){--x:-40px;--y:125px;--r:40deg;animation-delay:.07s}.crumbs.active .crumb:nth-child(4){--x:115px;--y:58px;--r:190deg;animation-delay:.02s}.crumbs.active .crumb:nth-child(5){--x:25px;--y:135px;--r:250deg;animation-delay:.08s}@keyframes scatter{0%{opacity:0;transform:translate(0,0) scale(1.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.5)}}.result{text-align:center;min-height:112px;padding:0 8px 12px}.result small{display:block;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.3em;color:#d6c6b4;margin:0 0 16px}.result strong{font-size:clamp(32px,7vw,47px);line-height:1.35;overflow-wrap:anywhere;letter-spacing:.08em}.result strong.refusal{font-size:clamp(30px,6vw,44px);color:#d9a58b}button,input,textarea{font:inherit}.throw{display:block;width:100%;padding:21px 15px;border:1px solid #e5d8c2;border-radius:13px;background:linear-gradient(145deg,#f0e5d2,#d9c7ae);color:#291b15;box-shadow:0 5px 0 #76604c,0 12px 22px #0007;font-weight:700;font-size:21px;letter-spacing:.15em;cursor:pointer;transition:transform .1s}.throw:active{transform:translateY(4px);box-shadow:0 1px 0 #76604c}.throw:disabled{opacity:.7;cursor:wait}.settings{border-top:1px solid #b4a08b99;margin-top:35px;padding-top:25px}.heading{font-size:17px;letter-spacing:.13em;margin:0 0 15px}.palette{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 30px}.swatch{background:transparent;border:1px solid transparent;padding:4px;border-radius:9px;cursor </style></head><body><main><header><h1>CLAY DICE</h1><div class="line"></div><p class="subtitle">決断を、粘土に丸投げ。</p></header><section class="stage" aria-label="紙粘土のサイコロ"><div class="floor"></div><img class="die" id="die" alt="不揃いな手作り紙粘土のサイコロ"><div class="crumbs" id="crumbs" aria-hidden="true"><i class="crumb"></i><i class="crumb"></i><i class="crumb"></i><i class="crumb"></i><i class="crumb"></i></div></section><section class="result" aria-live="polite"><small id="status">READY TO ROLL?</small><strong id="answer">さて、どうする？</strong></section><button class="throw" id="throw" type="button">サイコロを振る ↻</button><div class="note">※ まれにサイコロが決定を拒否します。</div><section class="settings"><h2 class="heading">01　サイコロの色を選ぶ</h2><div class="palette" id="palette" role="group" aria-label="サイコロの配色"></div><h2 class="heading">02　何を決める？</h2><label for="topic">お題（任意）</label><input class="field" id="topic" maxlength="80" value="今日の夕飯" placeholder="今日の夕飯"><label for="choices">選択肢（1行に1つ、2個以上）</label><textarea class="field" id="choices" rows="6" maxlength="3000" placeholder="焼きそば&#10;オムライス">焼きそば

const die=document.getElementById('die'),palette=document.getElementById('palette'),answer=document.getElementById('answer'),status=document.getElementById('status'),throwBtn=document.getElementById('throw'),topic=document.getElementById('topic'),choices=document.getElementById('choices'),crumbs=document.getElementById('crumbs');
let selected=0;try{const v=JSON.parse(localStorage.getItem('claydice-v2'));if(v){if(typeof v.topic==='string')topic.value=v.topic;if(typeof v.choices==='string')choices.value=v.choices;if(Number.isInteger(v.selected)&&v.selected>=0&&v.selected<pictures.length)selected=v.selected}}catch(e){}
function save(){try{localStorage.setItem('claydice-v2',JSON.stringify({selected,topic:topic.value,choices:choices.value}))}catch(e){}}
function setColor(i){selected=i;die.src=pictures[i];[...palette.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));save()}
pictures.forEach((src,i)=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.setAttribute('aria-label',['生成り','くすみピンク','マスタード','くすみグリーン','ブルー','ラベンダー','オレンジ'][i]);b.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src=src;img.alt='';b.appendChild(img);b.addEventListener('click',()=>setColor(i));palette.appendChild(b)});setColor(selected);[topic,choices].forEach(el=>el.addEventListener('input',save));
function restartAnimation(cls){die.classList.remove('roll','break','restore');void die.offsetWidth;die.classList.add(cls)}
throwBtn.addEventListener('click',()=>{const list=choices.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(list.length<2){status.textContent='HOLD ON';answer.textContent='選択肢を2つ以上入れてね。';return}throwBtn.disabled=true;die.style.opacity='1';crumbs.classList.remove('active');answer.classList.remove('refusal');answer.textContent='……';status.textContent=topic.value.trim()||'DECIDING';restartAnimation('roll');const refused=Math.random()<.03;const result=list[Math.floor(Math.random()*list.length)];setTimeout(()=>{die.classList.remove('roll');if(refused){restartAnimation('break');crumbs.classList.add('active');setTimeout(()=>{status.textContent='NOPE.';answer.textContent='自分で決めて。';answer.classList.add('refusal');throwBtn.disabled=false;throwBtn.textContent='もう一回お願いする ↻'},600)}else{status.textContent='THE DICE HAS SPOKEN';answer.textContent=result;throwBtn.disabled=false;throwBtn.textContent='もう一回振る ↻';restartAnimation('restore')}},1650)});
